name: 사이트 배포 (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: 공개 폴더에 원문이 섞이지 않았는지 검사
        run: |
          set -e
          test ! -d site/data || (echo "site/data 는 공개하면 안 됩니다" && exit 1)
          test ! -d site/review || (echo "site/review 는 공개하면 안 됩니다" && exit 1)
          ! ls site/apps/*/lesson.js 2>/dev/null
          ! find site -name '*.md' -o -name 'lesson.json' | grep -q .
          echo "검사 통과"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
