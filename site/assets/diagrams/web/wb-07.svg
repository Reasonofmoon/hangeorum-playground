<title id="diagram-title">WB07 · 브라우저로 열기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">브라우저로 열기. 본문에 제목을 넣으세요, 소개를 넣으세요., 활동 두 개가 표시됩니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
