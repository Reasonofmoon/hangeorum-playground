<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">WB15 · 오류 결과 관찰 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">오류 결과 관찰. 큰 글자와 여백 등 모양이 달라질 수 있습니다. 코드의 h1 열기·닫기 짝이 맞지 않습니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
