<text x="32" y="490" font-size="21" fill="#173e35" font-weight="400" text-anchor="start">짝이 맞지 않습니다.</text>
<text x="768" y="508" font-size="14" fill="#51685e" font-weight="400" text-anchor="end">한 걸음 실습실 / WB15</text>
