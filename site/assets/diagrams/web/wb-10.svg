<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">WB10 · 소개 문단 바꾸기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">소개 문단 바꾸기. 새 소개 문장이 &lt;p&gt;와 &lt;/p&gt; 사이에 있습니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect x="0" y="0" width="800" height="520" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2"/>
<rect x="30" y="24" width="96" height="42" rx="21" fill="#173e35" stroke="none" stroke-width="2"/>
<text x="78.0" y="53" font-size="22" fill="#fffdf8" font-weight="700" text-anchor="middle">WB10</text>
<text x="145" y="49" font-size="30" fill="#173e35" font-weight="700" text-anchor="start">소개 문단 바꾸기</text>
<text x="32" y="86" font-size="18" fill="#51685e" font-weight="400" text-anchor="start">교육용 도해 · 실제 화면 아님</text>
<line x1="32" y1="102" x2="768" y2="102" stroke="#cbd5c8" stroke-width="1" stroke-linecap="round"/>
<line x1="32" y1="430" x2="768" y2="430" stroke="#cbd5c8" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="461" font-size="21" fill="#173e35" font-weight="400" text-anchor="start">새 소개 문장이 &lt;p&gt;와 &lt;/p&gt; 사이에 있습니다.</text>
<text x="768" y="508" font-size="14" fill="#51685e" font-weight="400" text-anchor="end">한 걸음 실습실 / WB10</text>
<text x="54" y="165" font-size="38" fill="#173e35" font-weight="700" text-anchor="start">&lt;p&gt;</text>
<text x="674" y="380" font-size="38" fill="#173e35" font-weight="700" text-anchor="start">&lt;/p&gt;</text>
<rect x="109" y="203" width="580" height="127" rx="16" fill="#e5ece3" stroke="none" stroke-width="2"/>
<text x="142" y="254" font-size="34" fill="#173e35" font-weight="700" text-anchor="start">이곳은 식물을 관찰하는</text>
<text x="142" y="301" font-size="34" fill="#173e35" font-weight="700" text-anchor="start">작은 정원입니다.</text>
<line x1="140" y1="350" x2="595" y2="350" stroke="#dfaa55" stroke-width="6" stroke-linecap="round"/>
<text x="142" y="399" font-size="27" fill="#173e35" font-weight="400" text-anchor="start">시작·닫는 태그와 마침표 보존</text>
</g></svg>
