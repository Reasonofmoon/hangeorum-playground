<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">WB03 · 일반 텍스트 문서 열기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">일반 텍스트 문서 열기. 글자 크기 꾸미기 없이 코드를 입력할 빈 문서가 열립니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
