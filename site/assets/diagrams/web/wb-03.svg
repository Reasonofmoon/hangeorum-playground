<text x="78.0" y="53" font-size="22" fill="#fffdf8" font-weight="700" text-anchor="middle">WB03</text>
<text x="145" y="49" font-size="30" fill="#173e35" font-weight="700" text-anchor="start">일반 텍스트 문서 열기</text>
<text x="32" y="86" font-size="18" fill="#51685e" font-weight="400" text-anchor="start">교육용 도해 · 실제 화면 아님</text>
<line x1="32" y1="102" x2="768" y2="102" stroke="#cbd5c8" stroke-width="1" stroke-linecap="round"/>
<line x1="32" y1="430" x2="768" y2="430" stroke="#cbd5c8" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="461" font-size="21" fill="#173e35" font-weight="400" text-anchor="start">글자 크기 꾸미기 없이 코드를 입력할 빈 문서가 열립니다.</text>
<text x="768" y="508" font-size="14" fill="#51685e" font-weight="400" text-anchor="end">한 걸음 실습실 / WB03</text>
