<title id="diagram-title">WB08 · 탭 제목 바꾸기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">탭 제목 바꾸기. 편집기에 &lt;title&gt;작은 정원 소개&lt;/title&gt;가 보입니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
