<title id="diagram-title">WB02 · 작업 폴더 준비 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">작업 폴더 준비. 웹연습이라는 빈 폴더가 있습니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
