<title id="diagram-title">FN03 · 하위 폴더 만들기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">하위 폴더 만들기. 경로는 원고/초안입니다. 슬래시는 폴더 이름에 넣지 않습니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
