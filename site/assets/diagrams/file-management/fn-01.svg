<title id="diagram-title">FN01 · 목표와 안전 범위 읽기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">목표와 안전 범위 읽기. 목표를 읽었어요 버튼을 누르면 읽기 기록만 남습니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
