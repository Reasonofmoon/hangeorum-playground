<title id="diagram-title">FN12 · 완료와 숙련 구별하기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">완료와 숙련 구별하기. 완료는 이 가상 시나리오의 판정입니다. 실제 파일 관리 숙련은 확인하지 않았습니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
