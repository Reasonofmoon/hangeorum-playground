<title id="diagram-title">DC01 · 준비 폴더와 실행 환경 확인 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">준비 폴더와 실행 환경 확인. 저장 위치와 제품 종류가 기록됩니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
