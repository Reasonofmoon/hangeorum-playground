<text x="78.0" y="53" font-size="22" fill="#fffdf8" font-weight="700" text-anchor="middle">DC12</text>
<text x="145" y="49" font-size="30" fill="#173e35" font-weight="700" text-anchor="start">목차 전체 업데이트</text>
<text x="32" y="86" font-size="18" fill="#51685e" font-weight="400" text-anchor="start">교육용 도해 · 실제 화면 아님</text>
