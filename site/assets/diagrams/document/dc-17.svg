<text x="32" y="461" font-size="21" fill="#173e35" font-weight="400" text-anchor="start">새 조건을 읽고 직접 구성하세요. 정답은 도해에 표시하지 않습니다.</text>
<text x="768" y="508" font-size="14" fill="#51685e" font-weight="400" text-anchor="end">한 걸음 실습실 / DC17</text>
