<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">DC11 · 원고 제목 바꾸기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">원고 제목 바꾸기. 진행 순서가 함께 읽는 순서로 바뀌고 제목 2가 유지됩니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect x="0" y="0" width="800" height="520" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2"/>
<rect x="30" y="24" width="96" height="42" rx="21" fill="#173e35" stroke="none" stroke-width="2"/>
<text x="78.0" y="53" font-size="22" fill="#fffdf8" font-weight="700" text-anchor="middle">DC11</text>
<text x="145" y="49" font-size="30" fill="#173e35" font-weight="700" text-anchor="start">원고 제목 바꾸기</text>
<text x="32" y="86" font-size="18" fill="#51685e" font-weight="400" text-anchor="start">교육용 도해 · 실제 화면 아님</text>
<line x1="32" y1="102" x2="768" y2="102" stroke="#cbd5c8" stroke-width="1" stroke-linecap="round"/>
<line x1="32" y1="430" x2="768" y2="430" stroke="#cbd5c8" stroke-width="1" stroke-linecap="round"/>
<text x="32" y="461" font-size="21" fill="#173e35" font-weight="400" text-anchor="start">진행 순서가 함께 읽는 순서로 바뀌고 제목 2가 유지됩니다.</text>
<text x="768" y="508" font-size="14" fill="#51685e" font-weight="400" text-anchor="end">한 걸음 실습실 / DC11</text>
<rect x="47" y="143" width="207" height="42" rx="21" fill="#e5ece3" stroke="none" stroke-width="2"/>
<text x="150.5" y="172" font-size="26" fill="#173e35" font-weight="700" text-anchor="middle">제목 2 유지</text>
<text x="61" y="230" font-size="34" fill="#51685e" font-weight="400" text-anchor="start">진행 순서</text>
<line x1="59" y1="218" x2="240" y2="218" stroke="#9a4a2d" stroke-width="3" stroke-linecap="round"/>
<line x1="290" y1="220" x2="405" y2="220" stroke="#dfaa55" stroke-width="4" stroke-linecap="round"/>
<path d="M 393.5 226.0 L 405 220 L 393.5 214.0" fill="none" stroke="#dfaa55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="447" y="230" font-size="33" fill="#173e35" font-weight="700" text-anchor="start">함께 읽는 순서</text>
<path d="M73 291 H729" fill="none" stroke="#a2b4a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<text x="62" y="342" font-size="28" fill="#173e35" font-weight="700" text-anchor="start">본문 제목은 변경</text>
<text x="62" y="390" font-size="25" fill="#173e35" font-weight="400" text-anchor="start">목차에는 아직 이전 제목이 남을 수 있음</text>
</g></svg>
