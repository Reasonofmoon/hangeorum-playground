<title id="diagram-title">DC10 · 페이지 나누기로 시작 위치 정하기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">페이지 나누기로 시작 위치 정하기. 모임 소개와 진행 안내가 각각 새 쪽에서 시작합니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
