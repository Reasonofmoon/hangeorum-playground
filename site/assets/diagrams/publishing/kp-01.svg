<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">KP01 · 연습 범위부터 고르기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">연습 범위부터 고르기. 판매 시작이 아닌 초안·증거·미해결 목록이 목표가 됩니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
