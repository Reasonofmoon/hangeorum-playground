<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">KP17 · 새 책의 보류 사유 판단하기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">새 책의 보류 사유 판단하기의 새 조건과 빈 기록란. 독립 과제의 정답은 표시하지 않음. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다. 독립 과제 조건만 제시하며 정답과 완성 결과는 숨겼습니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect x="0" y="0" width="800" height="520" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2"/>
<rect x="30" y="24" width="96" height="42" rx="21" fill="#173e35" stroke="none" stroke-width="2"/>
<text x="78.0" y="53" font-size="22" fill="#fffdf8" font-weight="700" text-anchor="middle">KP17</text>
<text x="145" y="49" font-size="30" fill="#173e35" font-weight="700" text-anchor="start">새 책의 보류 사유 판단하기</text>
