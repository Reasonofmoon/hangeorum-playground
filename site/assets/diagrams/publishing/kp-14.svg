<title id="diagram-title">KP14 · 글자 크기 바꿔 읽기 확인하기 — 교육용 도해 / 실제 화면 아님</title>
<desc id="diagram-desc">글자 크기 바꿔 읽기 확인하기. 텍스트 누락과 줄 흐름 변화가 구별됩니다. 교육용 도해 · 실제 화면 아님. 교육용 도해이며 실제 프로그램 화면, 제품 캡처 또는 실제 파일 작업의 증거가 아닙니다.</desc>
