<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" role="img" aria-label="확대 영역: 새 조건 전이 과제 시작 화면. 받은파일의 메모.md와 요리책 조건이 보이며 완성 정답은 표시하지 않습니다."><title>확대 영역: 새 조건 전이 과제 시작 화면. 받은파일의 메모.md와 요리책 조건이 보이며 완성 정답은 표시하지 않습니다.</title><style>text{font-family:"Noto Sans CJK KR",sans-serif}</style><rect x="0" y="0" width="460" height="650" rx="0" fill="#f5f3ed" stroke="none"/><text x="22" y="33" font-size="23" fill="#183b37" font-weight="700">FN11 / 조작 위치 확대</text><text x="22" y="63" font-size="23" fill="#80631f" font-weight="700">연습 화면 모형</text><text x="22" y="88" font-size="18" fill="#80631f" font-weight="400">실제 화면 캡처 아님</text><rect x="16" y="108" width="428" height="514" rx="10" fill="#fff" stroke="#cbd8d5"/><circle cx="43" cy="140" r="14" fill="#086b63"/><text x="43" y="145" text-anchor="middle" font-size="15" fill="white" font-weight="700">1</text><text x="69" y="148" font-size="24" fill="#183b37" font-weight="400">새 과제 시작 / 이름 변경</text><text x="69" y="181" font-size="24" fill="#183b37" font-weight="400">/ 폴더 생성 / 이동 /</text><text x="69" y="214" font-size="24" fill="#183b37" font-weight="400">결과 확인</text><text x="33" y="240" font-size="20" fill="#183b37" font-weight="400">현재 과제 조건 → 받은파일의</text><text x="33" y="270" font-size="20" fill="#183b37" font-weight="400">메모.md</text><rect x="31" y="342" width="398" height="151" rx="10" fill="#edf6f2" stroke="none"/><text x="45" y="372" font-size="22" fill="#086b63" font-weight="700">과제 시작 상태</text><text x="45" y="409" font-size="26" fill="#183b37" font-weight="400">받은파일</text><text x="45" y="477" font-size="21" fill="#183b37" font-weight="400">가상 폴더 상태입니다.</text><circle cx="43" cy="528" r="14" fill="#086b63"/><text x="43" y="533" text-anchor="middle" font-size="15" fill="white" font-weight="700">2</text><text x="69" y="536" font-size="24" fill="#086b63" font-weight="700">예상 결과와 대조</text><text x="34" y="578" font-size="21" fill="#183b37" font-weight="400">이름과 경로를 따로 읽으세요.</text><text x="22" y="644" font-size="17" fill="#50666e" font-weight="400">공식 운영체제 UI 아님 · 실제 파일 접근 없음</text></svg>